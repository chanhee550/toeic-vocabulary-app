<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC 단어장</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0c0f1a; color: #eef0f6; font-family: -apple-system, 'Segoe UI', sans-serif;
    text-align: center;
  }
  .loader { padding: 40px; }
  .loader h2 { font-size: 1.3rem; margin-bottom: 12px; }
  .loader p { color: #8b92ab; font-size: 0.9rem; margin-bottom: 20px; }
  .loader a {
    display: inline-block; padding: 12px 28px; background: #6c8cff; color: white;
    border-radius: 8px; text-decoration: none; font-size: 0.95rem; margin: 6px;
    font-weight: 500;
  }
  .loader a.secondary { background: #1c2137; border: 1px solid #2a3050; color: #8b92ab; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid #2a3050; border-top-color: #6c8cff;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <h2>TOEIC 단어장</h2>
  <p>기기를 감지하는 중...</p>
  <noscript>
    <p style="color:#f87171;">JavaScript가 필요합니다. 직접 선택해 주세요:</p>
    <a href="toeic-typing.html">PC 버전</a>
    <a href="toeic-ios.html">iPhone 버전</a>
    <a href="toeic-mobile.html">Android 버전</a>
  </noscript>
  <div id="manual" style="display:none;">
    <p>직접 선택해 주세요:</p>
    <a href="toeic-typing.html">PC 버전</a>
    <a href="toeic-ios.html">iPhone 버전</a>
    <a href="toeic-mobile.html">Android 버전</a>
  </div>
</div>
<script>
(function() {
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isAndroid = /Android/i.test(ua);
  var isMobile = isIOS || isAndroid || /webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua)
    || (navigator.maxTouchPoints > 1 && window.innerWidth < 1024);

  var v = '_v=' + Date.now();
  try {
    if (isIOS) {
      window.location.replace('toeic-ios.html?' + v);
    } else if (isMobile) {
      window.location.replace('toeic-mobile.html?' + v);
    } else {
      window.location.replace('toeic-typing.html?' + v);
    }
  } catch(e) {
    document.getElementById('manual').style.display = 'block';
  }

  setTimeout(function() {
    document.getElementById('manual').style.display = 'block';
  }, 2000);
})();
</script>
</body>
</html>
