name: AX Accessibility Audit

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ax-python:
    name: "Python Static AX Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml

      - name: Run Python AX check
        run: python ax_check_python.py

  ax-pa11y:
    name: "pa11y Browser AX Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run pa11y AX check
        run: node ax_check_node.js
